<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Un pequeño regalo</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:ital,wght@0,300..700;1,300..700&family=Special+Elite&display=swap"
        rel="stylesheet">

    <!-- TAILWIND -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CONFIGURACION DE COLORES -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fondo: "#180310",
                        primero: "#6a2d1c",
                        segundo: "#70121f",
                        tercero: "#64603a",
                        extra1: "#d8d779",
                        extra2: "#f1b877"
                    }
                }
            }
        }
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="style/style.css">
</head>

<body class="min-h-screen text-primero red-hat-mono">

    <!-- ENCABEZADO -->
    <header class="relative bg-extra2 text-primero text-center px-4 pt-8 pb-12">

        <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl special-elite mb-3">
            Feliz cumpleaños Leny
        </h1>

        <!-- RECTANGULO DECORATIVO -->
        <div class="w-3/5 sm:w-1/2 md:w-2/5 lg:w-1/3 max-w-xl h-8 sm:h-10 md:h-12 bg-tercero mx-auto rounded-full">
        </div>

        <!-- BORDE ONDULADO -->
        <div class="absolute bottom-[-24px] left-0 w-full h-6 ondas-cabecera">
        </div>

    </header>

    <!-- CUERPO PRINCIPAL -->
    <main class="pt-16 pb-10">

        <!-- SECCION DE REGALOS -->
        <section class="max-w-6xl mx-auto px-3 sm:px-5 md:px-8 mb-12 sm:mb-16 md:mb-20">

            <!-- TITULO -->
            <header class="text-center mb-6 sm:mb-8">

                <h2 class="text-xl sm:text-2xl md:text-3xl text-extra2 font-bold special-elite">
                    tus regalitos
                </h2>

            </header>

            <!-- PANEL DE REGALOS -->
            <div class="bg-extra2 text-primero p-3 sm:p-5 md:p-8 lg:p-10 rounded-2xl border border-tercero/15">

                <!-- CONTENEDOR -->
                <div id="contenedor-regalos"
                    class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4 md:gap-6 w-full justify-items-center">
                </div>

            </div>

        </section>
    </main>

    <!-- ESTAMPADO DECORATIVO INFERIOR -->
    <div class="estampado"></div>

    <!-- PIE DE PAGINA -->
    <footer
        class="relative overflow-hidden bg-extra2 text-primero text-center w-full mt-6 sm:mt-8 pt-8 sm:pt-10 pb-6 sm:pb-8 px-3 sm:px-5 border-t border-tercero/15">

        <!-- TITULO -->
        <h2 class="text-xl sm:text-2xl md:text-3xl text-tercero special-elite mb-5 sm:mb-6">
            Créditos
        </h2>

        <!-- DETALLE DECORATIVO -->
        <div class="w-40 sm:w-56 md:w-72 lg:w-80 border-t-2 border-dashed border-tercero mx-auto mb-5 sm:mb-6">
        </div>

        <!-- LISTA DE CREDITOS -->
        <ul class="flex flex-col items-center gap-2 sm:gap-3 text-xs sm:text-sm md:text-base">
            <li>
                página creada:
                <span class="text-primero font-bold">11/20/2026</span>
            </li>

            <li>
                especial para:
                <span class="text-primero font-bold">Leny</span>
            </li>

            <li>
                hecha con mucho cariño para ti
            </li>
        </ul>

        <!-- DETALLE FINAL -->
        <div class="text-tercero text-xl sm:text-2xl mt-4 sm:mt-5 special-elite">
            ✦ ⋆ ✦
        </div>

        <!-- CREDITOS A ARTISTAS -->
        <div class="mt-6 sm:mt-8 flex flex-col items-center gap-2 sm:gap-3">

            <p class="text-fondo text-[10px] sm:text-xs opacity-70">
                Artistas participantes en el regalo
            </p>

            <div class="flex items-center justify-center gap-3 sm:gap-4 md:gap-5">

                <img src="style/img/fasvif.png" alt="Firma del artista 1" class="w-8 sm:w-10 md:w-12 h-auto opacity-70">
                <img src="style/img/kiref.png" alt="Firma del artista 2" class="w-8 sm:w-10 md:w-12 h-auto opacity-70">
                <img src="style/img/leof.png" alt="Firma del artista 3" class="w-8 sm:w-10 md:w-12 h-auto opacity-70">
                <img src="style/img/giff.png" alt="Firma del artista 4" class="w-8 sm:w-10 md:w-12 h-auto opacity-70">

            </div>
        </div>

    </footer>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
